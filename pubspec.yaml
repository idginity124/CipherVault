name: ciphervault_mobile
description: An offline encrypted vault for mobile and desktop.
publish_to: none
repository: https://github.com/idginity124/CipherVault
version: 2.0.1+3
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  qr_flutter: ^4.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.4
  share_plus: ^12.0.2
  qr_code_scanner_plus: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
  fonts:
    - family: CipherSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
